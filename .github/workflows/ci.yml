name: CI

# Type-check (report-only for now), run the Vitest suite, and compile the app on
# every push/PR — the gate that replaces the manual bundle-grep + identifier-sweep
# we've been doing by hand. On a green push to master it then deploys the COMMITTED
# ref to Vercel (safer than the manual working-tree upload that caused the
# 2026-07-11 git-revert incident).
#
# ONE-TIME SETUP: add repo secret VERCEL_TOKEN (Settings > Secrets and variables >
# Actions). The org/project IDs below are not secret (they already live in
# scripts/deploy_vercel.ps1). Without the secret, `check` still runs; only deployment
# jobs fail harmlessly. To make production deploys manual instead of on-push, change the deploy
# job's `if:` to `github.event_name == 'workflow_dispatch'` and add workflow_dispatch
# to `on:`.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret scanning (audit S1) — BLOCKS preview and production deploys. Scans the
  # checkout (tracked files) with gitleaks; .env never reaches CI (gitignored) and
  # the two PEM-header string literals carry inline `gitleaks:allow` comments.
  # Pinned version; verified locally against this tree on 2026-07-18 (0 findings).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks scan (blocking)
        run: |
          set -euo pipefail
          # --fail: a 5xx/redirect must NOT be saved as the "tarball" (else tar
          #   dies with a cryptic 'not in gzip format' and blocks the deploy for a
          #   transient blip). --retry: ride out GitHub-release hiccups (review #11).
          curl --fail --retry 3 --retry-delay 2 --retry-all-errors -sSL \
            -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version   # fail loudly if the download is bad, not with a scan error
          ./gitleaks dir . --redact --no-banner --exit-code 1

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm ci: reproducible install from the committed lockfile (added 2026-08-05);
      # bare `npm install` could silently float dependency versions between runs.
      - run: npm ci
      # BLOCKING as of 2026-08-04: the pre-existing backlog (17 errors) is burned down to
      # zero, so this now holds the line. Neither Vercel nor `vite build` typechecks, so
      # before today a type error shipped to production silently — this is the only gate.
      - name: Type-check (blocking)
        run: npm run typecheck
      # Lint BLOCKS on ERRORS only (added 2026-08-07, KI-4). `eslint .` exits 1 for
      # errors and 0 for warnings, so this holds the error baseline at zero without
      # stranding deploys behind the 585 pre-existing warnings (mostly no-explicit-any
      # on untyped Supabase jsonb). The rules that matter here are the ones tsc cannot
      # see: react-hooks/rules-of-hooks caught a conditionally-called useMemo on
      # /mri-recon the day it was added.
      - name: Lint (blocking on errors)
        run: npm run lint
      # Unit tests BLOCK the deploy. The suite was reconciled to the current
      # engines on 2026-07-16 (waterfall/irrWaterfall/acqPromote) and all 82
      # pass; a red suite should now fail the build rather than ship.
      - name: Unit tests
        run: npm run test:run
      - name: Build (vite, mirrors Vercel)
        run: npm run build:ci
      # Dependency audit: BLOCKS only on a critical advisory in PRODUCTION deps
      # (what actually ships in the bundle). Dev-tooling advisories (vite/vitest
      # dev servers) and lower severities print for visibility without stranding
      # deploys behind upstream fixes we can't control. Known accepted risks as
      # of 2026-08-04 are documented in docs/SECURITY.md.
      - name: Dependency audit (blocking at critical, prod deps only)
        run: |
          npm audit --omit=dev || true
          npm audit --omit=dev --audit-level=critical

  # Staging smoke (Playwright): builds the app against the STAGING Supabase
  # project (neftwjesayzsfggluuts — never production) and drives a real browser
  # through login, the auth wall, and the core pages. The staging URL and anon
  # key are publishable by design (they ship in any staging bundle); only the
  # smoke user's password is a secret. BLOCKS deploys via the deploy job's needs.
  e2e-smoke:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://neftwjesayzsfggluuts.supabase.co
      # gitleaks:allow — STAGING anon key: publishable by design (ships in any staging
      # bundle); the staging project holds no production data. NOT the prod key.
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5lZnR3amVzYXl6c2ZnZ2x1dXRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NDUzMDYsImV4cCI6MjEwMTUyMTMwNn0.eihExGpRhCBpQXWylwnOdtByKWS7HzAbsr35C9Ywie4 # gitleaks:allow
      STAGING_SMOKE_EMAIL: smoke@staging.local
      STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright chromium
        run: npx playwright install chromium --with-deps
      - name: Build against staging
        run: npm run build:ci
      - name: Staging smoke tests
        run: npm run test:e2e

  preview:
    needs: [check, secrets]
    # Same-repository pull requests receive an isolated Vercel preview URL.
    # This intentionally omits --prod, so master and the live application are
    # never changed by the preview job.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_8u90qS4wCl8RhHbboldHZyzT
      VERCEL_PROJECT_ID: prj_dGADWiLryETbJ5inT8pUZOHg7jYJ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy pull request preview to Vercel
        run: |
          npm i -g vercel@latest
          preview_url=$(vercel deploy --yes --token="$VERCEL_TOKEN")
          echo "Preview: $preview_url"
          echo "## Vercel preview" >> "$GITHUB_STEP_SUMMARY"
          echo "[$preview_url]($preview_url)" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  deploy:
    needs: [check, secrets, e2e-smoke]
    # Deploy the COMMITTED master ref on every green push to master (and on manual
    # dispatch). This makes committed master HEAD the single source of truth for
    # production and retires the working-tree upload (scripts/deploy_vercel.ps1),
    # which let a stale session clobber another session's committed work.
    # Requires repo secret VERCEL_TOKEN; without it this job fails harmlessly.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: team_8u90qS4wCl8RhHbboldHZyzT
      VERCEL_PROJECT_ID: prj_dGADWiLryETbJ5inT8pUZOHg7jYJ

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy committed ref to Vercel (production)
        run: |
          npm i -g vercel@latest
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
